name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # hatch-vcs derives the version from tags, so a shallow clone breaks the build.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group lint --group test

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format
        run: uv run ruff format --check --diff .

      - name: mypy
        run: uv run mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # --no-default-groups, or uv also installs the `dev` group, which pulls in ruff,
        # mypy and pre-commit that this job never invokes.
        run: uv sync --no-default-groups --group test

      - name: Run tests
        run: uv run pytest --cov=loss_landscapes --cov-report=term-missing

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      # Tests import the installed package, which under an editable install is the source
      # tree, so only a check on the artifact itself can catch a wheel full of stale
      # modules of the kind 3.0.6 shipped.
      - name: Verify wheel contents
        run: uv run --no-project python scripts/check_wheel_contents.py dist/*.whl

      # TODO: the packaging rewrite is meant to be invisible to anyone installing the
      # package, and this fails the build if the contract drifts. Drop this step once the
      # follow-up PR changes the contract deliberately.
      - name: Verify the published dependency contract is unchanged
        run: uv run python scripts/compare_with_published.py --version 3.0.6

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
