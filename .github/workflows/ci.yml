name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run --no-sync ruff check --output-format=github .
      - run: uv run --no-sync ruff format --check --diff .
      - run: uv run --no-sync mypy

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install locked compatibility driver
        run: uv sync --locked --only-group compatibility --no-install-project
      - name: Derive supported combinations from tox
        id: matrix
        shell: bash
        run: |
          matrix=$(uv run --no-sync tox list -d --no-desc | python -c 'import json,sys; print(json.dumps({"include": [{"environment": n, "python": "3." + n.split("-")[0][3:]} for n in sys.stdin.read().split()]}))')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Provision stable source-install interpreter
        run: uv run --no-sync uv python install --install-dir .tox/python --upgrade --no-bin --no-registry 3.12
      - name: Build candidate distributions
        run: |
          uv build
          git rev-parse HEAD
          sha256sum dist/*
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - name: Validate actual source archive
        shell: bash
        run: uv run --no-sync tox run -e sdist --installpkg dist/*.tar.gz --result-json .tox/sdist-result.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sdist-diagnostics
          path: |
            .tox/*/log/
            .tox/.*/log/
            .tox/*result.json
          include-hidden-files: true
          if-no-files-found: warn

  compatibility:
    name: Compatibility (${{ matrix.environment }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install locked compatibility driver
        run: uv sync --locked --only-group compatibility --no-install-project
      - name: Provision stable managed interpreters
        run: uv run --no-sync uv python install --install-dir .tox/python --upgrade --no-bin --no-registry ${{ matrix.python }} 3.12
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - name: Verify candidate identity
        run: |
          git rev-parse HEAD
          sha256sum dist/*
      - name: Test installed candidate wheel
        run: uv run --no-sync tox run -e ${{ matrix.environment }} --installpkg dist/*.whl --result-json .tox/compatibility-result.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diagnostics-${{ matrix.environment }}
          path: |
            .tox/*/log/
            .tox/.*/log/
            .tox/*result.json
          include-hidden-files: true
          if-no-files-found: warn
