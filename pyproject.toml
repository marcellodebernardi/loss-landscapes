[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "loss_landscapes"
description = "A library for approximating loss landscapes in low-dimensional parameter subspaces"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Marcello De Bernardi", email = "marcello.debernardi@stcatz.ox.ac.uk" },
]
dynamic = ["version"]

# TODO: both of these reproduce the contract published as 3.0.6, so that the packaging
# rewrite is a no-op for consumers, and both are wrong: torch is imported at module load
# but not declared, and no Python below 3.10 can install a usable torch. Fix together with
# the classifiers below, and drop the compare_with_published.py step from ci.yml.
requires-python = ">=3.5"
dependencies = ["numpy"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
]

[project.urls]
Homepage = "https://github.com/marcellodebernardi/loss-landscapes"
Repository = "https://github.com/marcellodebernardi/loss-landscapes"
Changelog = "https://github.com/marcellodebernardi/loss-landscapes/blob/master/CHANGELOG.md"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/loss_landscapes"]

[tool.hatch.build.targets.sdist]
include = ["src/loss_landscapes", "tests", "README.md", "LICENSE", "CHANGELOG.md"]


# --- dev environment -------------------------------------------------------

[tool.uv]
# `requires-python` above describes no environment the test suite can run in. This
# confines resolution to what we actually develop against, without touching published
# metadata.
environments = ["python_version >= '3.10'"]

# On Linux, plain `torch` is the multi-gigabyte CUDA build, none of which the tests use.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = [{ include-group = "test" }, { include-group = "lint" }, "pre-commit>=3.5"]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    # A real runtime dependency of the library, kept here because 3.0.6 does not declare it.
    "torch>=2",
]
lint = ["ruff>=0.6", "mypy>=1.11"]


# --- linting and formatting ------------------------------------------------

[tool.ruff]
line-length = 120
# TODO: the example notebook is pinned to a Python 3.6 kernel and has not run since 2019.
# Rewrite it, then drop this exclusion.
extend-exclude = ["examples/"]
# Pinned to the oldest Python the package claims to support, so no autofix rewrites the
# library into syntax that contract disallows. Revisit with `requires-python`.
target-version = "py37"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "D",   # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Public API re-exports.
"src/loss_landscapes/__init__.py" = ["F401"]
"src/loss_landscapes/metrics/__init__.py" = ["F401"]
# TODO: the library predates these rules and this branch does not edit library source.
# Remove each exemption as the follow-up PR brings the module up to standard.
#   D    - docstrings are reST-style and often missing; convert to Google style
#   E741 - `filter_normalize_` uses `l` as a layer index
#   E501 - one over-long line inside a commented-out, unfinished metric
#   F841 - unused locals in `contrib`, which has been dead since 2019
"src/loss_landscapes/**" = ["D"]
"src/loss_landscapes/model_interface/model_parameters.py" = ["D", "E741"]
"src/loss_landscapes/metrics/sl_metrics.py" = ["D", "E501"]
"src/loss_landscapes/contrib/*" = ["D", "E501", "F841"]
# Test names are the documentation; docstrings are used only where a test needs one.
"tests/**" = ["D1"]


# --- type checking ---------------------------------------------------------

# TODO: deliberately lenient, because the annotations have never been checked. Tighten
# these and add the PEP 561 `py.typed` marker once the package type-checks cleanly.
[tool.mypy]
files = ["src"]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
# `contrib` imports a module removed in 2019; see the xfail in tests/test_packaging.py.
exclude = ["^src/loss_landscapes/contrib/"]

# TODO: two issues in ModelParameters that need a source change: `__eq__` is typed as
# taking ModelParameters rather than object, and the class defines `__getitem__`/`__len__`
# but no `__iter__`, so it is iterable only through the legacy sequence protocol.
[[tool.mypy.overrides]]
module = "loss_landscapes.model_interface.model_parameters"
disable_error_code = ["override", "attr-defined"]


# --- tests -----------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
