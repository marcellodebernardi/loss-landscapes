[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "loss_landscapes"
description = "A library for approximating loss landscapes in low-dimensional parameter subspaces"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Marcello De Bernardi", email = "marcello.debernardi@stcatz.ox.ac.uk" },
]
dynamic = ["version"]

requires-python = ">=3.11,<3.16"
dependencies = ["numpy", "torch>=2.15,<2.16"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.urls]
Homepage = "https://github.com/marcellodebernardi/loss-landscapes"
Repository = "https://github.com/marcellodebernardi/loss-landscapes"
Changelog = "https://github.com/marcellodebernardi/loss-landscapes/blob/main/CHANGELOG.md"

[tool.hatch.version]
source = "vcs"


# --- dev environment -------------------------------------------------------

# On Linux, plain `torch` is the multi-gigabyte CUDA build; the tests are CPU-only.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = [{ include-group = "test" }, { include-group = "lint" }, { include-group = "compatibility" }, "pre-commit>=3.5"]
compatibility = ["tox>=4.28", "tox-uv>=1"]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
]
lint = ["ruff>=0.6", "mypy>=1.11"]


# --- linting and formatting ------------------------------------------------

[tool.ruff]
line-length = 120
# TODO: the example notebook targets a Python 3.6 kernel. Rewrite it, then drop this.
# Spec Kit scripts are generated upstream and refreshed by its CLI.
extend-exclude = ["examples/", ".specify/scripts/"]
# Tracks `requires-python`, so no autofix rewrites the library past what it claims.
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "D",   # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Public API re-exports.
"src/loss_landscapes/__init__.py" = ["F401"]
"src/loss_landscapes/metrics/__init__.py" = ["F401"]
# TODO: the library predates these rules. Remove each exemption as it is brought up to
# standard: D (reST docstrings), E741 (`l` as a layer index), E501 (one line in a
# commented-out metric), F841 (unused locals in the dead `contrib`).
"src/loss_landscapes/**" = ["D"]
"src/loss_landscapes/model_interface/model_parameters.py" = ["D", "E741"]
"src/loss_landscapes/metrics/sl_metrics.py" = ["D", "E501"]
"src/loss_landscapes/contrib/*" = ["D", "E501", "F841"]
# Test names are the documentation.
"tests/**" = ["D1"]


# --- type checking ---------------------------------------------------------

# TODO: lenient because the annotations have never been checked. Tighten these and add
# the PEP 561 `py.typed` marker once the package type-checks cleanly.
[tool.mypy]
files = ["src"]
# NumPy stubs in the Python 3.12 development environment use Python 3.12 syntax.
# Ruff enforces 3.11 source syntax; the compatibility matrix verifies runtime support.
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
# `contrib` imports a module removed in 2019; see the xfail in tests/test_packaging.py.
exclude = ["^src/loss_landscapes/contrib/"]

# TODO: `__eq__` is typed as taking ModelParameters rather than object, and the class has
# `__getitem__`/`__len__` but no `__iter__`. Both need a source change.
[[tool.mypy.overrides]]
module = "loss_landscapes.model_interface.model_parameters"
disable_error_code = ["override", "attr-defined"]


# --- tests -----------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true


# --- compatibility environments -------------------------------------------

[tool.tox]
requires = ["tox>=4.28", "tox-uv>=1"]
env_list = ["py311-torch215", "py312-torch215", "py313-torch215", "py314-torch215", "py315-torch215"]
skip_missing_interpreters = false

[tool.tox.env_run_base]
runner = "uv-venv-runner"
package = "wheel"
wheel_build_env = ".pkg"
dependency_groups = ["test"]
uv_resolution = "highest"
uv_python_preference = "only-managed"
recreate = true
set_env = { UV_PYTHON_INSTALL_DIR = "{tox_root}/.tox/python", UV_PYTHON_DOWNLOADS = "never", UV_TORCH_BACKEND = "cpu", UV_PRERELEASE = "disallow" }
commands = [["python", "-m", "pytest", "--compatibility-check", "--junitxml={env_log_dir}/junit.xml", { replace = "posargs", extend = true }]]

[tool.tox.env_pkg_base]
base_python = ["3.12"]
uv_python_preference = "only-managed"
set_env = { UV_PYTHON_INSTALL_DIR = "{tox_root}/.tox/python", UV_PYTHON_DOWNLOADS = "never", UV_PRERELEASE = "disallow" }

[tool.tox.env.sdist]
base_python = ["3.12"]
package = "sdist"
